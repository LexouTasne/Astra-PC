name: Astra CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Astra with gestures
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gesture,dev]"
      - name: Validate bootstrap shell
        run: bash -n install.sh
      - name: Compile
        run: python -m compileall -q astra_pc installer.py
      - name: Test
        run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Astra with gestures
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gesture,dev]"
      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content -Raw install.ps1)) | Out-Null
      - name: Compile
        run: python -m compileall -q astra_pc installer.py
      - name: Test
        run: pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Astra with gestures
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gesture,dev]"
      - name: Validate bootstrap shell
        run: bash -n install.sh
      - name: Compile
        run: python -m compileall -q astra_pc installer.py
      - name: Test
        run: pytest -q

  bootstrap-python314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Reproduce unsupported-host-Python install path
        run: python installer.py --diagnose-only --yes
