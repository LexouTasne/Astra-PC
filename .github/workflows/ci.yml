name: Astra CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Astra with gestures
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gesture,mesh,dev]"
      - name: Validate bootstrap shell
        run: bash -n install.sh
      - name: Compile
        run: python -m compileall -q astra_pc installer.py
      - name: Test
        run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Astra with gestures
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gesture,mesh,dev]"
      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content -Raw install.ps1)) | Out-Null
      - name: Compile
        run: python -m compileall -q astra_pc installer.py
      - name: Test
        run: pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Astra with gestures
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gesture,mesh,dev]"
      - name: Validate bootstrap shell
        run: bash -n install.sh
      - name: Compile
        run: python -m compileall -q astra_pc installer.py
      - name: Test
        run: pytest -q

  bootstrap-python314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Reproduce unsupported-host-Python install path
        run: python installer.py --diagnose-only --yes


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: astra-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
