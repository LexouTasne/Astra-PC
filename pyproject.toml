[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-pc"
version = "0.8.0"
description = "Distributed local-first multimodal assistant with Astra Mesh"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Richard Mateus / Lex"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "pynput>=1.7.7",
  "Pillow>=10",
  "psutil>=6.0",
  "screeninfo>=0.8.1",
  "pyperclip>=1.9.0"
]

[project.optional-dependencies]
gesture = ["mediapipe==0.10.21"]
mesh = [
  "aiohttp>=3.12",
  "cryptography>=45",
  "zeroconf>=0.148",
  "qrcode[pil]>=8"
]
voice = ["vosk>=0.3.45", "sounddevice>=0.4.7", "pyttsx3>=2.90"]
voice-fast = [
  "faster-whisper>=1.1.0",
  "webrtcvad-wheels>=2.0.14",
  "sounddevice>=0.4.7",
  "pyttsx3>=2.90"
]
tts-natural = ["piper-tts>=1.8,<2"]
accessibility = ["pywinauto>=0.6.9; platform_system == 'Windows'"]
wakeword = [
  "onnxruntime>=1.20",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "requests>=2.31",
  "tqdm>=4.66",
  "openwakeword>=0.6.0; platform_system != 'Linux'"
]
browser = ["playwright>=1.55"]
dev = ["pytest>=8"]

[project.scripts]
astra = "astra_pc.__main__:main"

[tool.setuptools.packages.find]
include = ["astra_pc*"]

[tool.pytest.ini_options]
markers = [
  "model_integration: slow tests that call local Ollama models",
  "vision_integration: very slow tests that call the local vision model"
]
